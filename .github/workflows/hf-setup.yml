name: Initialize private Hugging Face storage
on:
  push:
    branches: [main]
    paths: [.github/workflows/hf-setup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify token and private repositories
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo 'Missing HF_TOKEN GitHub secret' >&2; exit 1; }
          python -m pip install "huggingface_hub==0.36.2"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          user=api.whoami()
          print('Authenticated to Hugging Face')
          for name,kind in [('atml-pa4-results','dataset'),('atml-pa4-checkpoints','model')]:
              repo=f'mahnoorwaqas/{name}'
              api.create_repo(repo_id=repo,repo_type=kind,private=True,exist_ok=True)
              info=api.repo_info(repo_id=repo,repo_type=kind)
              if not info.private:
                  raise RuntimeError(f'{repo} is public; archive aborted')
              print('PRIVATE',repo)
          PY
