name: Validate PA4 Task 3 exact sampler
on:
  push:
    branches: [main]
    paths:
      - "task3/**"
      - "scripts/make_task3_kernel.py"
      - "scripts/make_task3_eval_kernel.py"
      - "scripts/archive_task3.py"
      - "scripts/archive_task3_eval.py"
      - "tests/test_task3_*.py"
      - ".github/workflows/task3-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy torch --index-url https://pypi.org/simple
      - run: python -m py_compile task3/*.py scripts/make_task3_kernel.py scripts/make_task3_eval_kernel.py scripts/archive_task3.py scripts/archive_task3_eval.py
      - name: Validate generated training/evaluation notebook Python
        run: |
          python - <<'PY'
          import ast,json,pathlib,subprocess,tempfile
          with tempfile.TemporaryDirectory() as d:
              base=pathlib.Path(d)
              lock=base/'lock.json'
              lock.write_text(json.dumps({'revisions':{k:'a'*40 for k in
                  ['gsm8k','model_target','model_draft','model_base','c4','wikitext','hellaswag']}}))
              for method in ('off','on'):
                  for seed in (6304,6305):
                      dst=base/f'{method}{seed}'
                      subprocess.run(['python','scripts/make_task3_kernel.py','--owner','mahnoorwaqas21',
                          '--run-id','12345-1','--sha','a'*40,'--source-lock',str(lock),
                          '--method',method,'--seed',str(seed),'--output',str(dst)],check=True)
                      ast.parse(''.join(json.loads((dst/'kernel.ipynb').read_text())['cells'][0]['source']))
              for method in ('original','off','on'):
                  dst=base/f'eval-{method}'
                  argv=['python','scripts/make_task3_eval_kernel.py','--owner','mahnoorwaqas21',
                        '--run-id','12345-1','--sha','a'*40,'--source-lock',str(lock),
                        '--condition',method,'--seed','6304','--output',str(dst)]
                  if method!='original':argv.extend(['--training-run-id','11111-1'])
                  subprocess.run(argv,check=True)
                  ast.parse(''.join(json.loads((dst/'kernel.ipynb').read_text())['cells'][0]['source']))
          PY
      - name: Run exact speculative sampler and Markov negative-control tests
        run: python -m unittest discover -s tests -p 'test_task3_*.py' -v
