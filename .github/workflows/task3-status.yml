name: Inspect all four Kaggle Task 3 notebook states
on:
  push:
    branches: [main]
    paths: [.github/workflows/task3-status.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - run: python -m pip install kaggle six
      - name: Check canonical Kaggle URLs
        shell: bash
        run: |
          echo "=== Corrected smoke ==="
          kaggle kernels status "mahnoorwaqas21/atml-pa4-t3-smoke-off-6304-45768845934-1" || true
          for method in off on; do
            for seed in 6304 6305; do
              kernel="mahnoorwaqas21/atml-pa4-task-3-${method}-seed-${seed}"
              echo "=== $kernel ==="
              kaggle kernels status "$kernel" || true
            done
          done
