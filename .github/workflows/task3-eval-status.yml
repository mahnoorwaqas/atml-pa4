name: Inspect Task 3 live GPU evaluation smoke states
on:
  push:
    branches: [main]
    paths: [.github/workflows/task3-eval-status.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - run: python -m pip install -q kaggle six
      - name: Check real Kaggle worker status
        run: |
          for run in 45825128611 45825496264; do
            slug="mahnoorwaqas21/atml-t3-eval-smoke-${run}-1"
            echo "==== $slug ===="
            kaggle kernels status "$slug" || true
          done
