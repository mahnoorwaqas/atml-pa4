name: Summarize Task 3 evaluations and private evidence
on:
  workflow_run:
    workflows: ["Evaluate Task 3 speculative decoding on Kaggle"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  summarize:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      EVALUATION_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "huggingface_hub==0.36.2" numpy
      - name: Summarize every completed condition, exact matched pairs and bootstrap CIs
        run: |
          python task3/summarize.py --evaluation-run-id "$EVALUATION_RUN_ID" --out report
          cat report/summary.md
      - name: Store private final summary (not public)
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ['HF_TOKEN'])
          repo='mahnoorwaqas/atml-pa4-results'
          assert api.repo_info(repo,repo_type='dataset').private
          api.upload_folder(repo_id=repo,repo_type='dataset',folder_path='report',
               path_in_repo='task3/analyses/github-run-'+os.environ['EVALUATION_RUN_ID'])
          print('Task 3 paired report archived privately')
          PY
      - name: Keep summary as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: task3-summary-${{ github.run_id }}
          path: report/*
          retention-days: 30
