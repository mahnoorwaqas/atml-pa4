name: Task 1 full Kaggle matrix
on:
  workflow_run:
    workflows: ["Run PA4 Task 1 on Kaggle"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task1:
    # Automatically start exactly once, after the initial Kaggle baseline succeeds.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.id == 45340451212 && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        experiment:
          - baseline
          - mag25
          - mag50
          - mag75
          - wanda25
          - wanda50
          - wanda75
          - adaptive50
          - adaptive75
          - structured50
          - int8
          - int4
          - int3
          - awq8
          - awq4
          - awq3
          - mixed4
          - mixed3
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: mahnoorwaqas21
      EXPERIMENT: ${{ matrix.experiment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate credentials and scripts
        shell: bash
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo 'Missing Kaggle token'; exit 1; }
          python -m py_compile task1/run.py scripts/make_kaggle_kernel.py
      - name: Install Kaggle CLI
        run: python -m pip install kaggle six
      - name: Make private GPU notebook
        shell: bash
        run: |
          python scripts/make_kaggle_kernel.py \
            --owner "$KAGGLE_USERNAME" \
            --run-id "${GITHUB_RUN_ID}-${EXPERIMENT}-${GITHUB_RUN_ATTEMPT}" \
            --experiment "$EXPERIMENT" --sha "$GITHUB_SHA" \
            --output kaggle_submission
      - name: Submit condition
        run: kaggle kernels push -p kaggle_submission
      - name: Poll condition
        shell: bash
        run: |
          set -euo pipefail
          kernel="$KAGGLE_USERNAME/atml-pa4-${GITHUB_RUN_ID}-${EXPERIMENT}-${GITHUB_RUN_ATTEMPT}"
          echo "Kaggle kernel: https://www.kaggle.com/code/$kernel"
          for ((i=0; i<325; i++)); do
            status="$(kaggle kernels status "$kernel" 2>&1 || true)"
            echo "${EXPERIMENT}: $status"
            u="${status^^}"
            if [[ "$u" == *COMPLETE* ]]; then exit 0; fi
            if [[ "$u" == *ERROR* || "$u" == *FAILED* || "$u" == *CANCEL* ]]; then exit 1; fi
            sleep 60
          done
          echo "Timed out; investigate the private Kaggle notebook." >&2
          exit 1
      - name: Retrieve outputs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p kaggle_results
          kaggle kernels output "$KAGGLE_USERNAME/atml-pa4-${GITHUB_RUN_ID}-${EXPERIMENT}-${GITHUB_RUN_ATTEMPT}" -p kaggle_results || true
      - name: Archive condition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task1-${{ matrix.experiment }}-${{ github.run_id }}
          path: |
            kaggle_results/
            kaggle_submission/kernel-metadata.json
          if-no-files-found: warn
          retention-days: 30
