name: Task 1 full Kaggle matrix
on:
  workflow_run:
    workflows: ["Run PA4 Task 1 on Kaggle"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task1:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.name == 'Run PA4 Task 1 on Kaggle') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        experiment:
          - mag25
          - mag50
          - mag75
          - wanda25
          - wanda50
          - wanda75
          - adaptive50
          - adaptive75
          - structured50
          - int8
          - int4
          - int3
          - awq8
          - awq4
          - awq3
          - mixed4
          - mixed3
    env:
      BASELINE_RUN_ID: ${{ github.event.workflow_run.id || '45344759542' }}
      BASELINE_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '1' }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: mahnoorwaqas21
      EXPERIMENT: ${{ matrix.experiment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate credentials and scripts
        shell: bash
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo 'Missing Kaggle token'; exit 1; }
          python -m py_compile task1/run.py scripts/make_kaggle_kernel.py
      - name: Install Kaggle CLI
        run: python -m pip install kaggle six
      - name: Reuse baseline's immutable public dataset and model revisions
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install "huggingface_hub==0.36.2"
          python scripts/fetch_baseline_lock.py \
            --run-id "$BASELINE_RUN_ID" \
            --attempt "$BASELINE_ATTEMPT" \
            --output source_revisions.json
      - name: Make private GPU notebook
        shell: bash
        run: |
          python scripts/make_kaggle_kernel.py \
            --owner "$KAGGLE_USERNAME" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --experiment "$EXPERIMENT" --sha "$GITHUB_SHA" \
            --source-lock source_revisions.json \
            --output kaggle_submission
      - name: Submit condition
        run: kaggle kernels push -p kaggle_submission
      - name: Poll condition
        shell: bash
        run: |
          set -euo pipefail
          kernel="$KAGGLE_USERNAME/atml-pa4-${EXPERIMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Kaggle kernel: https://www.kaggle.com/code/$kernel"
          for ((i=0; i<325; i++)); do
            status="$(kaggle kernels status "$kernel" 2>&1 || true)"
            echo "${EXPERIMENT}: $status"
            u="${status^^}"
            if [[ "$u" == *"PERMISSION"* || "$u" == *"CANNOT ACCESS KERNEL"* || "$u" == *"NOT FOUND"* || "$u" == *"404"* ]]; then
              echo "Kaggle status inaccessible. Aborting polling." >&2
              exit 1
            fi
            if [[ "$u" == *COMPLETE* ]]; then exit 0; fi
            if [[ "$u" == *ERROR* || "$u" == *FAILED* || "$u" == *CANCEL* ]]; then exit 1; fi
            sleep 60
          done
          echo "Timed out; investigate the private Kaggle notebook." >&2
          exit 1
      - name: Retrieve outputs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p kaggle_results
          kaggle kernels output "$KAGGLE_USERNAME/atml-pa4-${EXPERIMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -p kaggle_results || true
      - name: Archive completed results privately on Hugging Face
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install "huggingface_hub==0.36.2"
          python scripts/archive_to_hf.py \
            --download-dir kaggle_results \
            --experiment "$EXPERIMENT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-sha "$GITHUB_SHA"
      - name: Archive condition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task1-${{ matrix.experiment }}-${{ github.run_id }}
          path: |
            kaggle_results/
            kaggle_submission/kernel-metadata.json
          if-no-files-found: warn
          retention-days: 30
